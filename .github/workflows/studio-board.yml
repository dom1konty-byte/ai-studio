# Табло студии: обновляет закреплённый Issue «Табло студии» (проекты, этапы, ветки, последние сборки).
name: studio-board

on:
  push:
    paths: ["projects/**", "scripts/status.py", "scripts/dashboard.py", ".github/workflows/studio-board.yml"]
  schedule:
    - cron: "17 * * * *"   # раз в час
  workflow_dispatch:      # его же запускают workflow проектов после сборки

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: studio-board
  cancel-in-progress: true

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Обновить табло
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "main" ]; then EXTRA="--ref ${{ github.ref_name }}"; fi
          python3 scripts/dashboard.py --publish $EXTRA
      - name: Telegram — проект ждёт «да»
        if: ${{ github.event_name == 'push' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_approvals.py "${{ github.event.before }}" "${{ github.sha }}" "${{ github.ref_name }}"
