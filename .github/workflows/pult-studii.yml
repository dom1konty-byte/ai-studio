# Сборка Windows-программы «AI Studio» (пульт студии). Создано /new-project.
name: "pult-studii"

on:
  push:
    branches: [pult-studii, main]
    paths: ["projects/pult-studii/**", ".github/workflows/pult-studii.yml"]
  pull_request:
    paths: ["projects/pult-studii/**", ".github/workflows/pult-studii.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/pult-studii
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1   # закреплено; обновлять осознанно
          channel: stable
          cache: true
      - name: Создать windows/, если его нет
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.aistudio --project-name pult_studii .
            # flutter create кладёт шаблонный тест — он не наш
            git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1 || rm -f test/widget_test.dart
          fi
      - name: Иконка программы (exe, окно, панель задач)
        shell: bash
        run: cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - run: flutter analyze
      - id: test
        timeout-minutes: 15
        run: flutter test --timeout 60s
      - id: build
        run: flutter build windows --release --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: pult-studii-windows
          path: projects/pult-studii/build/windows/x64/runner/Release
          retention-days: 30
      - name: Установщик (Inno Setup)
        id: installer
        shell: bash
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --version=6.4.3 -y --no-progress
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then ISCC="iscc"; fi
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyAppVersion=$VERSION.${{ github.run_number }}" installer/setup.iss
      - uses: actions/upload-artifact@v7
        with:
          name: AI-Studio-setup
          path: projects/pult-studii/installer/output/AI-Studio-setup.exe
          retention-days: 30
      - name: Telegram — программа собрана
        if: ${{ success() && github.event_name != 'pull_request' && github.ref != 'refs/heads/main' && vars.TELEGRAM_BUILDS != 'off' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TZ: ${{ vars.TELEGRAM_TZ }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python ../../scripts/telegram_notify.py --silent --text "✅ <b>Пульт студии</b>: программа для Windows собрана.\n<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">скачать</a> (внизу, Artifacts)"
      - name: Telegram — сборка упала
        if: ${{ failure() && github.event_name != 'pull_request' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TZ: ${{ vars.TELEGRAM_TZ }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python ../../scripts/telegram_notify.py --text "❌ <b>Пульт студии</b>: сборка Windows упала на шаге: ${{ steps.test.outcome == 'failure' && 'flutter test' || steps.build.outcome == 'failure' && 'сборка .exe' || steps.installer.outcome == 'failure' && 'установщик' || 'другой шаг' }}. Студия чинит сама.\n<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">подробности</a>"

  board:
    # после сборки — обновить табло студии (ссылка на свежий файл)
    needs: [windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/studio-board.yml/dispatches -f ref=main || echo "табло ещё не в main"
