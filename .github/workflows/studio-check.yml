# Проверка самой студии: агенты, навыки, команды, скрипты.
name: studio-check

on:
  push:
    paths: [".claude/**", "scripts/**", "templates/**", ".github/workflows/studio-check.yml"]
  pull_request:
    paths: [".claude/**", "scripts/**", "templates/**", ".github/workflows/studio-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_studio.py
      - name: Шаблоны создаются
        run: |
          git config user.email ci@example.com && git config user.name ci
          for t in app site windows; do python3 scripts/new_project.py "Проверка $t" $t --no-branch; done
          ls projects
