# Сборка Windows-программы «ЧистоДиск»: тесты, .exe, установщик setup.exe (Inno Setup).
name: "chistka-pk"

on:
  push:
    branches: [chistka-pk]
    paths: ["projects/chistka-pk/**", ".github/workflows/chistka-pk.yml"]
  pull_request:
    paths: ["projects/chistka-pk/**", ".github/workflows/chistka-pk.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/chistka-pk
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1   # закреплено; обновлять осознанно
          channel: stable
          cache: true
      - name: Создать windows/, если его нет
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.aistudio --project-name chistka_pk .
          fi
      - name: Иконка программы
        shell: bash
        run: cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Установщик (Inno Setup)
        shell: bash
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then ISCC="iscc"; fi
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyAppVersion=$VERSION" installer/setup.iss
      - uses: actions/upload-artifact@v7
        with:
          name: ChistoDisk-setup
          path: projects/chistka-pk/installer/output/ChistoDisk-setup.exe
          retention-days: 30

  board:
    # после сборки — обновить табло студии (ссылка на свежий файл)
    needs: [windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/studio-board.yml/dispatches -f ref=main || echo "табло ещё не в main"
