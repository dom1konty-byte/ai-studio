<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заметки — макет</title>
<style>
:root{
  --primary:#226B58;--onprimary:#fff;--secondary:#4B635B;--surface:#F5FBF7;--onsurface:#171D1A;
  --onsurfvar:#404944;--outline:#707973;--outlinevar:#BFC9C3;--shigh:#E4EAE6;
  --pc:#B0F0D8;--onpc:#00281D;--error:#BA1A1A;--onerror:#fff;--errc:#FFDAD6;--onerrc:#410002;
  --page:#dfe6e2;--frame:#1b1f1d;--notetext:#1C1B1F;
  --c0:#EDF2EE;--c1:#FFD9D6;--c2:#FFE0B8;--c3:#FFF2B3;--c4:#D3F0C8;--c5:#C4F0EA;--c6:#D2E4FF;--c7:#E8DCFF;
  color-scheme:light;
}
html[data-theme=dark]{
  --primary:#8ED6BD;--onprimary:#00382B;--secondary:#B1CCC1;--surface:#0F1512;--onsurface:#DEE4E0;
  --onsurfvar:#BFC9C3;--outline:#89938D;--outlinevar:#404944;--shigh:#252B27;
  --pc:#00513E;--onpc:#B0F0D8;--error:#FFB4AB;--onerror:#690005;--errc:#93000A;--onerrc:#FFDAD6;
  --page:#0a0d0b;--frame:#000;--notetext:#E6E1E5;
  --c0:#232A26;--c1:#5C2B29;--c2:#5A3A12;--c3:#54480F;--c4:#26492A;--c5:#1E4A46;--c6:#263F63;--c7:#43326A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--page);color:var(--onsurface);min-height:100vh;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;flex:none;display:block}

/* страница */
.top{display:flex;gap:12px;align-items:center;justify-content:center;padding:12px 16px;flex-wrap:wrap}
.top span{font-size:14px;color:var(--onsurfvar)}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:20px;overflow:hidden}
.seg button{background:transparent;border:0;padding:0 18px;min-height:40px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--outline)}
.seg button[aria-pressed=true]{background:var(--pc);color:var(--onpc)}
.stage{display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:8px 16px 32px;flex-wrap:wrap}

/* телефон */
.phone{width:400px;max-width:100%;height:780px;max-height:calc(100vh - 80px);min-height:560px;background:var(--frame);border-radius:40px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--surface);container-type:inline-size}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);color:var(--onsurface)}
#list{overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:0 16px 96px}
.searchbar{margin:16px 16px 8px;height:56px;border-radius:28px;background:var(--shigh);display:flex;align-items:center;padding:0 4px 0 16px;gap:12px;flex:none}
.searchbar svg{color:var(--onsurfvar)}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--onsurface);outline:0;height:100%}
.searchbar input::placeholder{color:var(--onsurfvar)}
.searchbar:focus-within{outline:2px solid var(--primary)}
.icon-btn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:inherit;flex:none}
.icon-btn:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.hidden{display:none!important}
.section{font-size:12px;font-weight:500;color:var(--onsurfvar);padding:16px 0 8px;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@container (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{height:160px;border-radius:16px;padding:12px;border:0;text-align:left;color:var(--notetext);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card:hover{filter:brightness(.96)}
.card:active{filter:brightness(.92)}
.card .t{display:flex;align-items:center;gap:4px}
.card h3{margin:0;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;line-height:24px}
.card .t svg{width:16px;height:16px;color:var(--primary)}
.card p{margin:4px 0 0;font-size:14px;line-height:20px;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.fab{position:absolute;right:16px;bottom:16px;height:56px;border-radius:16px;border:0;background:var(--pc);color:var(--onpc);display:flex;align-items:center;gap:12px;padding:0 20px 0 16px;font-size:14px;font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.fab:hover{filter:brightness(.96)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 16px;color:var(--onsurfvar)}
.empty svg{width:64px;height:64px;color:var(--outline);margin-bottom:16px}
.empty b{font-size:16px;font-weight:500;color:var(--onsurface)}
.empty span{font-size:14px;margin-top:4px}

/* редактор */
#editor{transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
#editor.open{transform:none;visibility:visible;transition:transform .25s ease}
#editor{background:var(--bg,var(--surface));color:var(--notetext)}
.appbar{display:flex;align-items:center;padding:4px;flex:none}
.appbar .sp{flex:1}
.pinon{color:var(--primary)}
.ebody{flex:1;display:flex;flex-direction:column;padding:0 16px 16px;min-height:0}
#title{border:0;background:transparent;font:inherit;font-size:22px;font-weight:500;color:var(--notetext);padding:8px 0;outline:0;width:100%}
#title::placeholder,#body::placeholder,.item input::placeholder{color:var(--notetext);opacity:.55}
.type{display:inline-flex;align-self:flex-start;border:1px solid var(--outline);border-radius:20px;overflow:hidden;margin:4px 0 8px;flex:none}
.type button{border:0;background:transparent;min-height:40px;padding:0 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--notetext)}
.type button+button{border-left:1px solid var(--outline)}
.type button[aria-pressed=true]{background:var(--pc);color:var(--onpc)}
#body{flex:1;border:0;background:transparent;resize:none;font:inherit;font-size:16px;line-height:24px;color:var(--notetext);outline:0;padding:8px 0;min-height:0;width:100%}
#items{flex:1;overflow-y:auto;min-height:0}
.item{display:flex;align-items:center}
.item label{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.item input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary);margin:0;cursor:pointer}
.item input[type=text]{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--notetext);outline:0;height:48px}
.item.done input[type=text]{text-decoration:line-through;opacity:.55}
.addrow{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--primary);font-size:14px;font-weight:500;min-height:48px;padding:0 12px 0 12px;border-radius:24px}
.addrow:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}

/* диалоги */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}
.scrim.sheet{align-items:flex-end;padding:0}
.dialog{background:var(--surface);color:var(--onsurface);border-radius:28px;padding:24px;width:100%;max-width:312px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.dialog h2{margin:0 0 16px;font-size:24px;font-weight:400}
.dialog p{margin:0 0 24px;font-size:14px;color:var(--onsurfvar);line-height:20px}
.dialog .act{display:flex;justify-content:flex-end;gap:8px}
.btn{border:0;border-radius:20px;min-height:40px;padding:0 24px;font-size:14px;font-weight:500;background:transparent;color:var(--primary)}
.btn:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.btn.filled{background:var(--error);color:var(--onerror)}
.btn.filled:hover{filter:brightness(.93)}
.sheetbox{background:var(--surface);width:100%;border-radius:28px 28px 0 0;padding:24px 16px 32px}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:48px;height:48px;border-radius:50%;border:1px solid var(--outlinevar);display:flex;align-items:center;justify-content:center;color:var(--primary);padding:0}
.dot.sel{border:2px solid var(--primary)}
.snack{position:absolute;left:16px;right:16px;bottom:16px;background:#2f3130;color:#f0f1ee;border-radius:4px;padding:14px 16px;font-size:14px;z-index:20;box-shadow:0 3px 8px rgba(0,0,0,.3)}
html[data-theme=dark] .snack{background:#e1e3df;color:#2f3130}

/* виджеты */
.wblock{width:400px;max-width:100%}
.wblock h2{font-size:18px;font-weight:500;margin:8px 0 4px}
.wblock .hint{font-size:14px;color:var(--onsurfvar);margin:0 0 16px}
.wlabel{font-size:12px;color:var(--onsurfvar);margin:16px 0 6px}
.w{border-radius:16px;padding:12px;background:var(--surface);color:var(--onsurface);box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden;border:0;width:100%;text-align:left;display:block}
.w1{height:292px;display:flex;flex-direction:column;padding:12px 12px 8px}
.w1 .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.w1 .hd span{font-size:14px;color:var(--primary);font-weight:500;padding-left:4px}
.w1 .hd button{width:40px;height:40px;border-radius:50%;border:0;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center}
.wrow{display:flex;gap:8px;align-items:stretch;border:0;background:transparent;text-align:left;width:100%;padding:4px 4px;border-radius:8px;min-height:44px}
.wrow:hover{background:color-mix(in srgb,var(--onsurface) 8%,transparent)}
.wrow i{width:4px;border-radius:2px;flex:none}
.wrow div{min-width:0;flex:1}
.wrow b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--onsurface)}
.wrow small{display:block;font-size:12px;color:var(--onsurfvar);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wempty{margin:auto;font-size:14px;color:var(--onsurfvar);text-align:center}
.w2{height:200px;color:var(--notetext);display:flex;flex-direction:column;cursor:pointer}
.w2 .wt{display:flex;gap:4px;align-items:flex-start;font-size:16px;font-weight:700}
.w2 .wt svg{width:16px;height:16px;margin-top:3px;color:var(--primary)}
.w2 .wt span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.w2 .wb{font-size:14px;line-height:20px;margin-top:6px;white-space:pre-line;overflow:hidden;flex:1;text-overflow:ellipsis;word-break:break-word}
.w2.none{background:var(--surface);color:var(--onsurfvar);align-items:center;justify-content:center;text-align:center;font-size:14px}
.w3{height:72px;border-radius:28px;background:var(--pc);color:var(--onpc);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;cursor:pointer;width:200px;max-width:100%}
.w3:hover{filter:brightness(.95)}
.w3:active{filter:brightness(.9)}
.foot{font-size:12px;color:var(--onsurfvar);margin-top:20px}

@media (max-width:480px){
  .top{padding:8px}
  .stage{padding:0 0 24px;gap:24px}
  .phone{width:100%;height:calc(100vh - 56px);height:calc(100dvh - 56px);max-height:none;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
  .wblock{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){#editor{transition:none}}
</style>
</head>
<body>
<div class="top">
  <span>Тема для проверки:</span>
  <div class="seg" role="group" aria-label="Тема">
    <button id="thLight" aria-pressed="false">Светлая</button>
    <button id="thDark" aria-pressed="false">Тёмная</button>
  </div>
</div>

<main class="stage">
  <section class="phone" aria-label="Приложение Заметки">
    <div class="screen" id="screen">
      <div class="page" id="list">
        <div class="searchbar">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="q" type="search" placeholder="Поиск по заметкам" aria-label="Поиск по заметкам" autocomplete="off">
          <button class="icon-btn hidden" id="qclear" aria-label="Очистить"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        </div>
        <div class="scroll" id="notes"></div>
        <button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Заметка</button>
      </div>

      <div class="page" id="editor" aria-hidden="true">
        <div class="appbar">
          <button class="icon-btn" id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
          <span class="sp"></span>
          <button class="icon-btn" id="pin" aria-label="Закрепить"></button>
          <button class="icon-btn" id="palette" aria-label="Цвет"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.38 0 2.5-1.12 2.5-2.5 0-.65-.25-1.24-.65-1.68-.39-.44-.62-.98-.62-1.57 0-1.1.9-2 2-2H17c2.76 0 5-2.24 5-5 0-4.42-4.48-8-10-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg></button>
          <button class="icon-btn" id="del" aria-label="Удалить"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
        </div>
        <div class="ebody">
          <input id="title" type="text" placeholder="Заголовок" aria-label="Заголовок" autocomplete="off">
          <div class="type" role="group" aria-label="Тип заметки">
            <button id="tText" aria-pressed="true">Текст</button>
            <button id="tList" aria-pressed="false">Чек-лист</button>
          </div>
          <textarea id="body" placeholder="Текст заметки" aria-label="Текст заметки"></textarea>
          <div id="items" class="hidden"></div>
        </div>
      </div>
      <div id="overlay"></div>
    </div>
  </section>

  <aside class="wblock" aria-label="Виджеты">
    <h2>Виджеты на главном экране (Android)</h2>
    <p class="hint">Показывают текущие данные. Нажмите на заметку или «+», чтобы открыть её в приложении слева.</p>
    <div class="wlabel">Последние заметки</div>
    <div class="w w1" id="w1"></div>
    <div class="wlabel">Закреплённая заметка</div>
    <div id="w2" role="button" tabindex="0"></div>
    <div class="wlabel">Новая заметка</div>
    <div class="w3" id="w3" role="button" tabindex="0"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Новая заметка</div>
    <p class="foot">Макет для проверки. Настоящее приложение — APK</p>
  </aside>
</main>

<script>
(function(){
'use strict';
var KEY='zametki.preview.v1', NAMES=['Без цвета','Красный','Оранжевый','Жёлтый','Зелёный','Бирюзовый','Синий','Фиолетовый'];
var $=function(id){return document.getElementById(id)};
var ICON={
  pinF:'<svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>',
  pinO:'<svg viewBox="0 0 24 24"><path d="M14 4v5c0 1.12.37 2.16 1 3H9c.65-.86 1-1.9 1-3V4h4m3-2H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3V4h1c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>',
  add:'<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  noteAdd:'<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zm-5-7h-2v2H9v-2H7v-2h2V9h2v2h2v2z"/></svg>',
  searchOff:'<svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M3 4.3 4.3 3 21 19.7 19.7 21z" opacity=".9"/></svg>'
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---- тема ---- */
var mq=window.matchMedia('(prefers-color-scheme: dark)');
function setTheme(t){document.documentElement.setAttribute('data-theme',t);$('thLight').setAttribute('aria-pressed',t==='light');$('thDark').setAttribute('aria-pressed',t==='dark')}
setTheme(mq.matches?'dark':'light');
if(mq.addEventListener)mq.addEventListener('change',function(e){setTheme(e.matches?'dark':'light')});
$('thLight').onclick=function(){setTheme('light')};
$('thDark').onclick=function(){setTheme('dark')};

/* ---- хранение ---- */
var notes=[],nextId=1;
function load(){
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{var d=JSON.parse(raw);notes=d.notes||[];nextId=d.nextId||1;return}catch(e){}}
  var t=Date.now();
  notes=[
    {id:1,title:'Покупки',body:'',isChecklist:true,items:[{text:'молоко',checked:false},{text:'хлеб',checked:true},{text:'яблоки',checked:false},{text:'сыр',checked:false}],color:4,pinned:true,updatedAt:t-1000},
    {id:2,title:'Идеи',body:'Сайт для брата: визитка с ценами и формой заявки.\nПриложение для учёта расходов.',isChecklist:false,items:[],color:3,pinned:true,updatedAt:t-2000},
    {id:3,title:'Звонок',body:'Позвонить в сервис насчёт записи на четверг. Уточнить цену.',isChecklist:false,items:[],color:0,pinned:false,updatedAt:t-3000},
    {id:4,title:'План недели',body:'',isChecklist:true,items:[{text:'Сделать отчёт',checked:false},{text:'Тренировка',checked:false},{text:'Оплатить интернет',checked:false}],color:6,pinned:false,updatedAt:t-4000}
  ];
  nextId=5;persist();
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({notes:notes,nextId:nextId}))}catch(e){toast('Не удалось сохранить. Попробуйте ещё раз')}}
function byId(id){for(var i=0;i<notes.length;i++)if(notes[i].id===id)return notes[i]}
function title(n){return n.title.trim()||'Без названия'}
function isEmpty(n){return !n.title.trim()&&(n.isChecklist?n.items.every(function(i){return !i.text.trim()}):!n.body.trim())}
function matches(n,q){q=q.trim().toLowerCase();if(!q)return true;if(n.title.toLowerCase().indexOf(q)>-1)return true;
  return n.isChecklist?n.items.some(function(i){return i.text.toLowerCase().indexOf(q)>-1}):n.body.toLowerCase().indexOf(q)>-1}
function preview(n,max){
  var l=n.isChecklist?n.items.filter(function(i){return i.text.trim()}).map(function(i){return (i.checked?'☑ ':'☐ ')+i.text}):n.body.split('\n').filter(function(s){return s.trim()});
  return l.slice(0,max)
}
function sorted(){return notes.slice().sort(function(a,b){return b.updatedAt-a.updatedAt})}

/* ---- список ---- */
function renderList(){
  var q=$('q').value;
  $('qclear').classList.toggle('hidden',!q);
  var vis=sorted().filter(function(n){return matches(n,q)});
  var pinned=vis.filter(function(n){return n.pinned}),others=vis.filter(function(n){return !n.pinned});
  var h='';
  function cards(a){return '<div class="grid">'+a.map(function(n){
    return '<button class="card" data-id="'+n.id+'" style="background:var(--c'+n.color+')"><div class="t"><h3>'+esc(title(n))+'</h3>'+(n.pinned?ICON.pinF:'')+'</div><p>'+esc(preview(n,3).join('\n'))+'</p></button>'}).join('')+'</div>'}
  if(!vis.length){
    var s=notes.length>0;
    h='<div class="empty">'+(s?ICON.searchOff:ICON.noteAdd)+'<b>'+(s?'Ничего не найдено':'Пока нет заметок')+'</b><span>'+(s?'Попробуйте другое слово':'Нажмите «+», чтобы записать первую')+'</span></div>';
  }else{
    if(pinned.length)h+='<div class="section">Закреплённые</div>'+cards(pinned);
    if(pinned.length&&others.length)h+='<div class="section">Остальные</div>';
    if(others.length)h+=(pinned.length?'':'<div style="height:8px"></div>')+cards(others);
  }
  $('notes').innerHTML=h;
}
$('notes').addEventListener('click',function(e){var c=e.target.closest('.card');if(c)openEditor(+c.dataset.id)});
$('q').addEventListener('input',renderList);
$('qclear').onclick=function(){$('q').value='';renderList();$('q').focus()};
$('fab').onclick=function(){openEditor(null)};

/* ---- виджеты ---- */
function renderWidgets(){
  var s=sorted().slice(0,5);
  $('w1').innerHTML='<div class="hd"><span>Заметки</span><button id="w1add" aria-label="Новая заметка">'+ICON.add+'</button></div>'+
    (s.length?s.map(function(n){var p=preview(n,1)[0]||'';return '<button class="wrow" data-id="'+n.id+'"><i style="background:var(--c'+n.color+');box-shadow:inset 0 0 0 1px var(--outlinevar)"></i><div><b>'+esc(title(n))+'</b><small>'+esc(p)+'</small></div></button>'}).join(''):'<div class="wempty">Нет заметок. Нажмите +</div>');
  var p=sorted().filter(function(n){return n.pinned})[0],w2=$('w2');
  if(p){
    w2.className='w w2';w2.style.background='var(--c'+p.color+')';w2.dataset.id=p.id;
    w2.innerHTML='<div class="wt">'+ICON.pinF+'<span>'+esc(title(p))+'</span></div><div class="wb">'+esc(preview(p,50).join('\n'))+'</div>';
  }else{w2.className='w w2 none';w2.style.background='';delete w2.dataset.id;w2.textContent='Закрепите заметку в приложении'}
}
$('w1').addEventListener('click',function(e){
  if(e.target.closest('#w1add'))return openEditor(null,true);
  var r=e.target.closest('.wrow');if(r)openEditor(+r.dataset.id,true)});
function w2go(){var id=$('w2').dataset.id;openEditor(id?+id:null,true)}
$('w2').onclick=function(){if($('w2').dataset.id)w2go()};
$('w2').onkeydown=function(e){if((e.key==='Enter'||e.key===' ')&&$('w2').dataset.id){e.preventDefault();w2go()}};
$('w3').onclick=function(){openEditor(null,true)};
$('w3').onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openEditor(null,true)}};

/* ---- редактор ---- */
var cur=null,timer=null,editing=false;
function openEditor(id,fromWidget){
  if(editing)closeEditor();
  var n=id!=null?byId(id):null;
  cur=n?JSON.parse(JSON.stringify(n)):{id:null,title:'',body:'',isChecklist:false,items:[],color:0,pinned:false,updatedAt:Date.now()};
  editing=true;
  $('title').value=cur.title;$('body').value=cur.body;
  if(cur.isChecklist&&!cur.items.length)cur.items=[{text:'',checked:false}];
  applyEditor();
  var ed=$('editor');ed.classList.add('open');ed.setAttribute('aria-hidden','false');
  if(fromWidget&&window.matchMedia('(max-width:480px)').matches)window.scrollTo(0,0);
  setTimeout(function(){if(!n)$('title').focus()},260);
}
function applyEditor(){
  $('editor').style.setProperty('--bg','var(--c'+cur.color+')');
  $('pin').innerHTML=ICON.pinF.replace('<svg','<svg').replace('></svg>','></svg>');
  $('pin').innerHTML=cur.pinned?ICON.pinF:ICON.pinO;
  $('pin').classList.toggle('pinon',cur.pinned);
  $('pin').setAttribute('aria-label',cur.pinned?'Открепить':'Закрепить');
  $('tText').setAttribute('aria-pressed',!cur.isChecklist);
  $('tList').setAttribute('aria-pressed',cur.isChecklist);
  $('body').classList.toggle('hidden',cur.isChecklist);
  $('items').classList.toggle('hidden',!cur.isChecklist);
  if(cur.isChecklist)renderItems();
}
function renderItems(focusIdx){
  var h=cur.items.map(function(it,i){
    return '<div class="item'+(it.checked?' done':'')+'" data-i="'+i+'"><label><input type="checkbox" aria-label="Отметить"'+(it.checked?' checked':'')+'></label><input type="text" placeholder="Пункт" aria-label="Пункт" value="'+esc(it.text)+'"><button class="icon-btn" data-rm aria-label="Удалить пункт">'+ICON.close+'</button></div>'}).join('');
  $('items').innerHTML=h+'<button class="addrow" id="addItem">'+ICON.add+'Пункт</button>';
  if(focusIdx!=null){var el=$('items').querySelectorAll('input[type=text]')[focusIdx];if(el)el.focus()}
}
function sortItems(){var o=cur.items.filter(function(i){return !i.checked}),d=cur.items.filter(function(i){return i.checked});cur.items=o.concat(d)}
$('items').addEventListener('input',function(e){
  var row=e.target.closest('.item');if(!row||e.target.type!=='text')return;
  cur.items[+row.dataset.i].text=e.target.value;sched()});
$('items').addEventListener('change',function(e){
  var row=e.target.closest('.item');if(!row||e.target.type!=='checkbox')return;
  cur.items[+row.dataset.i].checked=e.target.checked;sortItems();renderItems();sched()});
$('items').addEventListener('click',function(e){
  if(e.target.closest('#addItem')){
    var fd=cur.items.findIndex(function(i){return i.checked}),at=fd<0?cur.items.length:fd;
    cur.items.splice(at,0,{text:'',checked:false});renderItems(at);sched();return}
  var rm=e.target.closest('[data-rm]');
  if(rm){var i=+rm.closest('.item').dataset.i;cur.items.splice(i,1);if(!cur.items.length)cur.items.push({text:'',checked:false});renderItems();sched()}});
$('items').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.type==='text'){e.preventDefault();var i=+e.target.closest('.item').dataset.i;cur.items.splice(i+1,0,{text:'',checked:false});renderItems(i+1);sched()}});
$('title').addEventListener('input',function(){cur.title=this.value;sched()});
$('body').addEventListener('input',function(){cur.body=this.value;sched()});
function setType(c){
  if(c===cur.isChecklist)return;
  if(c){
    cur.items=cur.body.split('\n').filter(function(s){return s.trim()}).map(function(s){return {text:s.trim(),checked:false}});
    if(!cur.items.length)cur.items=[{text:'',checked:false}];
  }else{
    cur.body=cur.items.map(function(i){return i.text}).filter(function(s){return s.trim()}).join('\n');
    $('body').value=cur.body;cur.items=[];
  }
  cur.isChecklist=c;applyEditor();sched();
}
$('tText').onclick=function(){setType(false)};
$('tList').onclick=function(){setType(true)};
$('pin').onclick=function(){cur.pinned=!cur.pinned;applyEditor();sched()};
function sched(){clearTimeout(timer);timer=setTimeout(function(){save(false)},1500)}
function snapshot(){
  var n=JSON.parse(JSON.stringify(cur));
  if(n.isChecklist){n.body='';n.items=n.items.filter(function(i){return i.text.trim()}).map(function(i){return {text:i.text.trim(),checked:i.checked}})}else n.items=[];
  return n;
}
function same(a,b){return a.title===b.title&&a.body===b.body&&a.isChecklist===b.isChecklist&&a.color===b.color&&a.pinned===b.pinned&&JSON.stringify(a.items)===JSON.stringify(b.items)}
function save(closing){
  clearTimeout(timer);
  if(!cur)return;
  var n=snapshot();
  if(isEmpty(n)){
    if(cur.id!=null&&closing){notes=notes.filter(function(x){return x.id!==cur.id});cur.id=null;persist();refresh()}
    return;
  }
  if(cur.id==null){cur.id=nextId++;n.id=cur.id}
  var old=byId(cur.id);
  if(old&&same(old,n))return;
  n.updatedAt=Date.now();
  if(old)notes[notes.indexOf(old)]=n;else notes.push(n);
  persist();refresh();
}
function refresh(){renderList();renderWidgets()}
function closeEditor(){
  save(true);
  editing=false;cur=null;
  var ed=$('editor');ed.classList.remove('open');ed.setAttribute('aria-hidden','true');
  if(document.activeElement&&ed.contains(document.activeElement))document.activeElement.blur();
}
$('back').onclick=closeEditor;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('overlay').firstChild){$('overlay').innerHTML='';return}
    if(editing)closeEditor();
  }});
window.addEventListener('pagehide',function(){if(editing)save(true)});

/* ---- цвет ---- */
$('palette').onclick=function(){
  var h='<div class="scrim sheet" id="sc"><div class="sheetbox" role="dialog" aria-label="Цвет заметки"><div class="colors">';
  for(var i=0;i<8;i++)h+='<button class="dot'+(i===cur.color?' sel':'')+'" data-c="'+i+'" aria-label="'+NAMES[i]+'" style="background:var(--c'+i+')">'+(i===cur.color?ICON.check:'')+'</button>';
  $('overlay').innerHTML=h+'</div></div></div>';
  var f=$('overlay').querySelector('.dot.sel');if(f)f.focus();
};
/* ---- удаление ---- */
$('del').onclick=function(){
  $('overlay').innerHTML='<div class="scrim" id="sc"><div class="dialog" role="alertdialog" aria-labelledby="dh"><h2 id="dh">Удалить заметку?</h2><p>Точно удалить? Вернуть будет нельзя.</p><div class="act"><button class="btn" data-no>Отмена</button><button class="btn filled" data-yes>Удалить</button></div></div></div>';
  $('overlay').querySelector('[data-no]').focus();
};
$('overlay').addEventListener('click',function(e){
  var d=e.target.closest('.dot');
  if(d){cur.color=+d.dataset.c;$('overlay').innerHTML='';applyEditor();sched();return}
  if(e.target.closest('[data-no]')||e.target.id==='sc'){$('overlay').innerHTML='';return}
  if(e.target.closest('[data-yes]')){
    $('overlay').innerHTML='';clearTimeout(timer);
    if(cur.id!=null){notes=notes.filter(function(x){return x.id!==cur.id});persist()}
    editing=false;cur=null;
    var ed=$('editor');ed.classList.remove('open');ed.setAttribute('aria-hidden','true');
    refresh();toast('Заметка удалена');
  }
});

/* ---- уведомление ---- */
var tt;
function toast(msg){
  var s=$('screen'),old=s.querySelector('.snack');if(old)old.remove();
  var el=document.createElement('div');el.className='snack';el.setAttribute('role','status');el.textContent=msg;s.appendChild(el);
  clearTimeout(tt);tt=setTimeout(function(){el.remove()},3500);
}

load();refresh();
})();
</script>
</body>
</html>
