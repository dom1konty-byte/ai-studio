# Проверка шаблонов студии: из каждого шаблона создаётся проект и реально собирается.
# Android — с подписью тестовым ключом (проверяем, что подпись подключается). Windows — сборка .exe.
name: studio-templates

on:
  push:
    paths: ["templates/**", "scripts/new_project.py", "scripts/android_signing.py", ".github/workflows/studio-templates.yml"]
  pull_request:
    paths: ["templates/**", "scripts/new_project.py", "scripts/android_signing.py", ".github/workflows/studio-templates.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.1, channel: stable, cache: true }
      - name: Проект из шаблона
        run: python3 scripts/new_project.py "Проверка" app --no-branch
      - name: Как в workflow проекта, но с тестовым ключом
        working-directory: projects/proverka
        run: |
          flutter create --platforms=android --org com.aistudio --project-name proverka .
          flutter pub get
          flutter analyze
          flutter test
          python3 ../../scripts/android_signing.py android/app/build.gradle.kts
          python3 ../../scripts/android_signing.py android/app/build.gradle.kts   # повтор безопасен
          keytool -genkeypair -keystore android/app/upload-keystore.jks -alias upload -keyalg RSA -keysize 2048 \
            -validity 365 -storepass testpass -keypass testpass -dname "CN=ai-studio-test"
          printf 'storeFile=upload-keystore.jks\nstorePassword=testpass\nkeyAlias=upload\nkeyPassword=testpass\n' > android/key.properties
          flutter build apk --release --build-number=7
          flutter build appbundle --release --build-number=7
          ls -la build/app/outputs/bundle/release/app-release.aab
      - name: APK подписан тестовым ключом, а не отладочным
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs projects/proverka/build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -q "CN=ai-studio-test" certs.txt

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.1, channel: stable, cache: true }
      - run: python3 scripts/new_project.py "Проверка игры" game --no-branch
      - name: Игра собирается
        working-directory: projects/proverka-igry
        run: |
          flutter create --platforms=android --org com.aistudio --project-name proverka_igry .
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.50.1, channel: stable, cache: true }
      - name: Проект из шаблона
        shell: bash
        run: python scripts/new_project.py "Проверка" windows --no-branch
      - name: Сборка .exe
        shell: bash
        working-directory: projects/proverka
        run: |
          flutter create --platforms=windows --org com.aistudio --project-name proverka .
          flutter pub get
          flutter test
          flutter build windows --release
          ls build/windows/x64/runner/Release/*.exe

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 scripts/new_project.py "Проверка" site --no-branch
      - run: npx --yes html-validate@9 "projects/proverka/site/**/*.html"
