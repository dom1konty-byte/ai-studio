# Сборка Windows-программы «ЧистоДиск»: тесты, .exe, установщик setup.exe (Inno Setup).
name: "chistka-pk"

on:
  push:
    branches: [chistka-pk, main]
    paths: ["projects/chistka-pk/**", ".github/workflows/chistka-pk.yml"]
  pull_request:
    paths: ["projects/chistka-pk/**", ".github/workflows/chistka-pk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/chistka-pk
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1   # закреплено; обновлять осознанно
          channel: stable
          cache: true
      - name: Создать windows/, если его нет
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.aistudio --project-name chistka_pk .
          fi
      - name: Окно не показывать само (для запуска в трее)
        shell: bash
        run: |
          # Показ окна делает window_manager (show/hide), а не шаблон runner.
          sed -i -E 's#^([[:space:]]*)this->Show\(\);#\1// this->Show();#' windows/runner/flutter_window.cpp
          # без этого окно мигнёт при запуске в трее — шаг должен упасть, если шаблон изменился
          grep -q '// this->Show();' windows/runner/flutter_window.cpp
      - name: Иконка программы
        shell: bash
        run: cp assets/icon/app_icon.ico windows/runner/resources/app_icon.ico
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Установщик (Inno Setup)
        shell: bash
        run: |
          if ! command -v iscc >/dev/null 2>&1 && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --version=6.4.3 -y --no-progress
          fi
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then ISCC="iscc"; fi
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          MSYS_NO_PATHCONV=1 "$ISCC" "/DMyAppVersion=$VERSION" installer/setup.iss
      - uses: actions/upload-artifact@v7
        with:
          name: ChistoDisk-setup
          path: projects/chistka-pk/installer/output/ChistoDisk-setup.exe
          retention-days: 30

  board:
    # после сборки — обновить табло студии (ссылка на свежий файл)
    needs: [windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/studio-board.yml/dispatches -f ref=main || echo "табло ещё не в main"

  release:
    # только слияние в main: публикуем релиз с установщиком и sha256 (для обновления из программы)
    needs: [windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: ChistoDisk-setup
          path: dist
      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version:' projects/chistka-pk/pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Версия в pubspec должна быть x.y.z, сейчас: $VERSION"; exit 1; }
          TAG="chistka-pk-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Релиз уже есть — поднимите версию в pubspec"
            exit 0
          fi
          cd dist
          sha256sum ChistoDisk-setup.exe > ChistoDisk-setup.exe.sha256
          gh release create "$TAG" ChistoDisk-setup.exe ChistoDisk-setup.exe.sha256 \
            --title "ЧистоДиск $VERSION" \
            --notes "Установщик ЧистоДиск $VERSION. Программа сама предложит обновиться." \
            --target ${{ github.sha }}
