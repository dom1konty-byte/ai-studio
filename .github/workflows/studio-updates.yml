# Сообщение в Telegram, когда Dependabot предложил обновления.
# pull_request_target: код PR не запускается (только сообщение), поэтому доступ к секретам безопасен.
name: studio-updates

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # ветка main, не код PR
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TZ: ${{ vars.TELEGRAM_TZ }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          NUM: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/telegram_notify.py --silent --text "🔄 Есть обновления: $TITLE
          Скажи в офисе: «проверь обновления PR #$NUM» — студия проверит сборки и спросит «да».
          <a href=\"$URL\">PR #$NUM</a>"
