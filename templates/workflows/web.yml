# Проверка и сборка сайта «{{NAME}}». Создано /new-project.
name: "{{SLUG}}"

on:
  push:
    paths: ["projects/{{SLUG}}/**", ".github/workflows/{{SLUG}}.yml"]
  pull_request:
    paths: ["projects/{{SLUG}}/**", ".github/workflows/{{SLUG}}.yml"]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/{{SLUG}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверка HTML
        run: npx --yes html-validate@9 "site/**/*.html"
      - uses: actions/upload-artifact@v4
        with:
          name: {{SLUG}}-site
          path: projects/{{SLUG}}/site
          retention-days: 30
      # Публикация на Cloudflare Pages: только из main (= после «да» на Выпуске) и только если заданы секреты.
      - name: Публикация (Cloudflare Pages)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Секретов Cloudflare нет — сайт не опубликован. См. навык landing-page, раздел «Деплой»."
            exit 0
          fi
          npx --yes wrangler@4 pages project create {{SLUG}} --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy site --project-name={{SLUG}} --branch=main
          echo "Сайт: https://{{SLUG}}.pages.dev"

  board:
    # после сборки — обновить табло студии (ссылка на свежий файл)
    needs: [site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/studio-board.yml/dispatches -f ref=main || echo "табло ещё не в main"
